<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a shelf of four game cards on the home view; picking one swaps in a centered play stage. Single dark look by choice. */
:root {
  --bg: #16142e;
  --panel: #211e44;
  --panel2: #2b2756;
  --ink: #f4f1ff;
  --muted: #a8a2d8;
  --line: rgba(190, 180, 255, 0.2);
  --coral: #ff6b6b;
  --mint: #4be3b0;
  --sun: #ffd23f;
  --sky: #5bb8ff;
  --c: var(--mint);
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 0 56px; min-width: 0; }
a { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

h1 { font: 400 clamp(32px, 7vw, 56px)/1.05 var(--display); margin: 0 0 8px; letter-spacing: 0.01em; }
.sub { margin: 0 0 28px; color: var(--muted); max-width: 52ch; }

/* home */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
  padding: 16px; text-decoration: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--c); }
.card .ico {
  width: 76px; height: 76px; border-radius: 16px; display: grid; place-items: center;
  background: var(--panel2);
  background: color-mix(in srgb, var(--c) 20%, var(--panel));
  color: var(--c);
}
.card h2 { font: 400 22px/1.1 var(--display); margin: 4px 0 0; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .best { margin-top: auto; padding-top: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c); font-weight: 700; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; }

/* game view */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.back {
  text-decoration: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); font-weight: 500; font-size: 14px;
}
.back:hover { border-color: var(--c); }
.bar h2 { font: 400 clamp(24px, 5vw, 34px)/1 var(--display); margin: 0; color: var(--c); }
#stage { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.how { max-width: 520px; margin: 16px auto 0; color: var(--muted); font-size: 14px; }

.hud { display: flex; gap: 10px; }
.stat {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
  padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
}
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.stat b { font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }

.board {
  position: relative; width: 100%; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.sq { aspect-ratio: 1 / 1; }
.bo { aspect-ratio: 4 / 3; }
.board canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; text-align: center;
  padding: 16px; background: rgba(18, 16, 42, 0.82);
}
.overlay strong { font: 400 clamp(22px, 6vw, 32px)/1.1 var(--display); color: var(--c); }
.overlay p { margin: 0; max-width: 30ch; color: var(--ink); }
.btn {
  font: 700 15px/1 var(--body); color: #17142d; background: var(--c);
  border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; margin-top: 6px;
}
.btn:hover { filter: brightness(1.08); }
.btn.alt { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }
.ctl { display: flex; gap: 8px; justify-content: center; }

/* 2048 */
.b2048 {
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 2.6%; padding: 2.6%; background: var(--panel2); container-type: inline-size;
}
.t {
  display: grid; place-items: center; border-radius: 9%; background: rgba(255, 255, 255, 0.06);
  font: 400 28px/1 var(--display); font-size: 9cqw; font-variant-numeric: tabular-nums; min-width: 0;
}
.t[data-len="3"] { font-size: 7.6cqw; }
.t[data-len="4"] { font-size: 6.2cqw; }
.t[data-len="5"] { font-size: 5cqw; }
.t.pop { animation: pop 0.18s ease-out; }
.t.merge { animation: merge 0.17s ease-out; }
@keyframes pop { from { transform: scale(0.45); } to { transform: scale(1); } }
@keyframes merge { 50% { transform: scale(1.14); } }

/* memory */
.mboard { padding: 10px; }
.mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mcard { position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; background: none; cursor: pointer; perspective: 600px; min-width: 0; }
.mcard .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.35s ease; }
.mcard.flip .in { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.front {
  background: var(--panel2);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 6px, transparent 6px 12px);
  border: 1px solid var(--line);
}
.face.rev { transform: rotateY(180deg); background: #2f2a60; font-size: clamp(26px, 9vw, 46px); border: 2px solid transparent; }
.mcard.done .face.rev { border-color: var(--c); background: #1d3a40; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<main class="wrap">
  <div id="home">
    <h1>Pocket Arcade</h1>
    <p class="sub">Four quick games that run right here. No installs, no sign-up. Pick one and play.</p>
    <div class="grid" id="grid"></div>
    <p class="foot">Best scores are saved on this device.</p>
  </div>

  <div id="view" hidden>
    <div class="bar">
      <a class="back" href="#home">&larr; All games</a>
      <h2 id="gameTitle"></h2>
    </div>
    <div id="stage"></div>
    <p class="how" id="how"></p>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function rand(n) { return Math.floor(Math.random() * n); }
  function store(key, def) { try { var v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function scope() {
    var offs = [];
    return {
      on: function (t, ev, fn, opt) { t.addEventListener(ev, fn, opt); offs.push(function () { t.removeEventListener(ev, fn, opt); }); },
      add: function (fn) { offs.push(fn); },
      done: function () { offs.splice(0).forEach(function (f) { f(); }); }
    };
  }
  function hud(stage, items) {
    var bar = el('div', 'hud'), out = {};
    items.forEach(function (it) {
      var d = el('div', 'stat'); d.appendChild(el('span', null, it[1])); var b = el('b', null, '0'); d.appendChild(b);
      out[it[0]] = b; bar.appendChild(d);
    });
    stage.appendChild(bar); return out;
  }
  function overlay(parent) {
    var o = el('div', 'overlay'); o.hidden = true; parent.appendChild(o);
    return {
      show: function (title, text, btn, onClick) {
        o.hidden = false; o.innerHTML = '';
        o.appendChild(el('strong', null, title));
        if (text) o.appendChild(el('p', null, text));
        if (btn) {
          var b = el('button', 'btn', btn); b.type = 'button';
          b.addEventListener('click', function (e) { e.stopPropagation(); if (onClick) onClick(); });
          o.appendChild(b);
        }
      },
      hide: function () { o.hidden = true; }
    };
  }
  function swipe(sc, target, cb) {
    var sx = 0, sy = 0, active = false;
    sc.on(target, 'pointerdown', function (e) { if (e.pointerType === 'mouse') return; sx = e.clientX; sy = e.clientY; active = true; });
    sc.on(target, 'pointerup', function (e) {
      if (!active) return; active = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
    sc.on(target, 'pointercancel', function () { active = false; });
  }
  var KEYDIR = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };

  /* ---------- Snake ---------- */
  function snake(stage) {
    var sc = scope(), KEY = 'pa-best-snake', G = 20;
    var H = hud(stage, [['score', 'Score'], ['best', 'Best']]);
    var board = el('div', 'board sq'), cv = el('canvas'); board.appendChild(cv); stage.appendChild(board);
    var ov = overlay(board), ctx = cv.getContext('2d');
    var best = store(KEY, 0), score = 0, body, dir, queue, food, state = 'ready', timer = 0;
    H.best.textContent = best;

    function size() {
      var r = board.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr)); draw();
    }
    function placeFood() {
      var p; do { p = { x: rand(G), y: rand(G) }; } while (body.some(function (s) { return s.x === p.x && s.y === p.y; }));
      food = p;
    }
    function reset() {
      body = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; dir = { x: 1, y: 0 }; queue = [];
      score = 0; H.score.textContent = 0; placeFood();
    }
    function ready() { reset(); state = 'ready'; draw(); ov.show('Ready?', 'Press an arrow key, or swipe, to start.'); }
    function schedule() { clearTimeout(timer); timer = setTimeout(tick, Math.max(62, 150 - Math.floor(score / 4) * 6)); }
    function start() { state = 'playing'; ov.hide(); schedule(); }
    function turn(name) {
      if (state === 'over' || state === 'paused') return;
      var d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[name];
      var last = queue.length ? queue[queue.length - 1] : dir;
      var reverse = d.x === -last.x && d.y === -last.y, same = d.x === last.x && d.y === last.y;
      if (!reverse && !same && queue.length < 2) queue.push(d);
      if (state === 'ready') start();
    }
    function die() {
      state = 'over'; var nb = score > best;
      if (nb) { best = score; save(KEY, best); H.best.textContent = best; }
      draw(); ov.show('Game over', 'You scored ' + score + '.' + (nb ? ' New best!' : ''), 'Play again', ready);
    }
    function tick() {
      if (state !== 'playing') return;
      if (queue.length) dir = queue.shift();
      var head = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      var eating = head.x === food.x && head.y === food.y;
      var solid = eating ? body : body.slice(0, -1);
      if (head.x < 0 || head.y < 0 || head.x >= G || head.y >= G || solid.some(function (s) { return s.x === head.x && s.y === head.y; })) { die(); return; }
      body.unshift(head);
      if (eating) { score++; H.score.textContent = score; placeFood(); } else { body.pop(); }
      draw(); schedule();
    }
    function draw() {
      var w = cv.width, c = w / G, x, y;
      for (y = 0; y < G; y++) for (x = 0; x < G; x++) { ctx.fillStyle = (x + y) % 2 ? '#1c1a3b' : '#201d44'; ctx.fillRect(x * c, y * c, c, c); }
      ctx.fillStyle = '#ffd23f'; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = c * 0.7;
      ctx.beginPath(); ctx.arc((food.x + 0.5) * c, (food.y + 0.5) * c, c * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      body.forEach(function (s, i) {
        var t = 1 - (i / Math.max(body.length, 1)) * 0.6;
        ctx.fillStyle = 'hsl(160 75% ' + (32 + 30 * t) + '%)';
        rr(ctx, s.x * c + 1, s.y * c + 1, c - 2, c - 2, c * 0.28); ctx.fill();
      });
      var h = body[0], ex = dir.x, ey = dir.y;
      ctx.fillStyle = '#10222a';
      [[-1, 1], [1, 1]].forEach(function (o) {
        var px = (h.x + 0.5) * c + (ex * 0.18 + (ey !== 0 ? o[0] * 0.2 : 0)) * c;
        var py = (h.y + 0.5) * c + (ey * 0.18 + (ex !== 0 ? o[0] * 0.2 : 0)) * c;
        ctx.beginPath(); ctx.arc(px, py, c * 0.09, 0, Math.PI * 2); ctx.fill();
      });
    }

    sc.on(window, 'keydown', function (e) {
      var m = KEYDIR[e.key];
      if (m) { e.preventDefault(); turn(m); return; }
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (state === 'over') ready();
        else if (state === 'playing') { state = 'paused'; clearTimeout(timer); ov.show('Paused', 'Press Space to resume.'); }
        else if (state === 'paused') { state = 'playing'; ov.hide(); schedule(); }
      }
    });
    swipe(sc, board, turn);
    var ro = new ResizeObserver(size); ro.observe(board); sc.add(function () { ro.disconnect(); clearTimeout(timer); });
    ready(); size();
    return function () { sc.done(); };
  }

  /* ---------- 2048 ---------- */
  function g2048(stage) {
    var sc = scope(), KEY = 'pa-best-2048', i;
    var H = hud(stage, [['score', 'Score'], ['best', 'Best']]);
    var board = el('div', 'board sq b2048'), tiles = [];
    for (i = 0; i < 16; i++) { var d = el('div', 't'); tiles.push(d); board.appendChild(d); }
    stage.appendChild(board);
    var ov = overlay(board);
    var ctl = el('div', 'ctl'), nb = el('button', 'btn alt', 'New game'); nb.type = 'button'; ctl.appendChild(nb); stage.appendChild(ctl);
    var cells, score, best = store(KEY, 0), won, locked;

    function render(newIdx, merged) {
      cells.forEach(function (v, k) {
        var t = tiles[k]; t.textContent = v || '';
        if (v) { t.style.background = 'hsl(' + ((Math.log2(v) * 37 + 8) % 360) + ' 78% 62%)'; t.style.color = '#1a1633'; t.dataset.len = String(String(v).length); }
        else { t.style.background = ''; t.style.color = ''; delete t.dataset.len; }
        t.className = 't' + (newIdx === k ? ' pop' : '') + (merged && merged.has(k) ? ' merge' : '');
      });
    }
    function spawn() {
      var e = []; cells.forEach(function (v, k) { if (!v) e.push(k); });
      if (!e.length) return -1;
      var k = e[rand(e.length)]; cells[k] = Math.random() < 0.9 ? 2 : 4; return k;
    }
    function newGame() {
      cells = []; for (var k = 0; k < 16; k++) cells.push(0);
      score = 0; won = false; locked = false; ov.hide(); H.score.textContent = 0; H.best.textContent = best;
      spawn(); var n = spawn(); render(n, null);
    }
    function canMove() {
      for (var k = 0; k < 16; k++) {
        if (!cells[k]) return true;
        var x = k % 4, y = Math.floor(k / 4);
        if (x < 3 && cells[k] === cells[k + 1]) return true;
        if (y < 3 && cells[k] === cells[k + 4]) return true;
      }
      return false;
    }
    function move(name) {
      if (locked) return;
      var dirN = { left: 0, up: 1, right: 2, down: 3 }[name], moved = false, gained = 0, merged = new Set();
      for (var a = 0; a < 4; a++) {
        var idx = [0, 1, 2, 3].map(function (j) {
          return dirN === 0 ? a * 4 + j : dirN === 2 ? a * 4 + 3 - j : dirN === 1 ? j * 4 + a : (3 - j) * 4 + a;
        });
        var vals = idx.map(function (k) { return cells[k]; }).filter(function (v) { return v; });
        var out = [], mergedAt = [];
        for (var j = 0; j < vals.length; j++) {
          if (vals[j] === vals[j + 1]) { out.push(vals[j] * 2); gained += vals[j] * 2; mergedAt.push(out.length - 1); j++; }
          else out.push(vals[j]);
        }
        while (out.length < 4) out.push(0);
        for (var q = 0; q < 4; q++) { if (cells[idx[q]] !== out[q]) moved = true; cells[idx[q]] = out[q]; }
        mergedAt.forEach(function (q) { merged.add(idx[q]); });
      }
      if (!moved) return;
      score += gained; H.score.textContent = score;
      if (score > best) { best = score; save(KEY, best); H.best.textContent = best; }
      var n = spawn(); render(n, merged);
      if (!won && cells.some(function (v) { return v >= 2048; })) {
        won = true; locked = true;
        ov.show('You made 2048!', 'Keep going to push your score higher.', 'Keep going', function () { locked = false; ov.hide(); });
      } else if (!canMove()) {
        locked = true; ov.show('No moves left', 'Final score ' + score + '.', 'Try again', newGame);
      }
    }

    sc.on(window, 'keydown', function (e) { var m = KEYDIR[e.key]; if (m) { e.preventDefault(); move(m); } });
    swipe(sc, board, move);
    sc.on(nb, 'click', newGame);
    newGame();
    return function () { sc.done(); };
  }

  /* ---------- Memory Match ---------- */
  function memory(stage) {
    var sc = scope(), KEY = 'pa-best-memory';
    var EMO = ['🐙', '🦊', '🌵', '🍉', '🚀', '🎧', '🪁', '🧩'];
    var NAMES = ['octopus', 'fox', 'cactus', 'watermelon', 'rocket', 'headphones', 'kite', 'puzzle piece'];
    var H = hud(stage, [['moves', 'Moves'], ['time', 'Time'], ['best', 'Best']]);
    var board = el('div', 'board mboard'), grid = el('div', 'mgrid'); board.appendChild(grid); stage.appendChild(board);
    var ov = overlay(board);
    var ctl = el('div', 'ctl'), nb = el('button', 'btn alt', 'Restart'); nb.type = 'button'; ctl.appendChild(nb); stage.appendChild(ctl);
    var cards, first, lock, moves, matched, startT, tInt, dead = false, best = store(KEY, 0);

    function fmt(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
    function flip(c, on) { c.open = on; c.el.classList.toggle('flip', on); c.el.setAttribute('aria-label', on || c.done ? NAMES[c.v] : 'Hidden card'); }
    function build() {
      clearInterval(tInt); first = null; lock = false; moves = 0; matched = 0; startT = 0;
      H.moves.textContent = 0; H.time.textContent = '0:00'; H.best.textContent = best ? best : '-';
      ov.hide(); grid.innerHTML = '';
      var vals = []; EMO.forEach(function (_, k) { vals.push(k, k); });
      for (var k = vals.length - 1; k > 0; k--) { var j = rand(k + 1), t = vals[k]; vals[k] = vals[j]; vals[j] = t; }
      cards = vals.map(function (v, k) {
        var b = el('button', 'mcard'); b.type = 'button'; b.setAttribute('aria-label', 'Hidden card');
        var inn = el('span', 'in'); inn.appendChild(el('span', 'face front')); inn.appendChild(el('span', 'face rev', EMO[v]));
        b.appendChild(inn); grid.appendChild(b);
        var c = { v: v, el: b, open: false, done: false };
        b.addEventListener('click', function () { pick(k); });
        return c;
      });
    }
    function pick(k) {
      var c = cards[k];
      if (lock || c.open || c.done) return;
      if (!startT) { startT = Date.now(); tInt = setInterval(function () { H.time.textContent = fmt(Date.now() - startT); }, 250); }
      flip(c, true);
      if (first === null) { first = k; return; }
      moves++; H.moves.textContent = moves;
      var a = cards[first], b = c; first = null;
      if (a.v === b.v) {
        a.done = b.done = true; a.el.classList.add('done'); b.el.classList.add('done'); matched++;
        if (matched === EMO.length) win();
      } else {
        lock = true;
        setTimeout(function () { if (dead) return; flip(a, false); flip(b, false); lock = false; }, 750);
      }
    }
    function win() {
      clearInterval(tInt); var ms = Date.now() - startT, nbst = !best || moves < best;
      if (nbst) { best = moves; save(KEY, best); H.best.textContent = best; }
      setTimeout(function () { if (!dead) ov.show('All matched!', moves + ' moves in ' + fmt(ms) + '.' + (nbst ? ' New best!' : ''), 'Play again', build); }, 450);
    }
    sc.on(nb, 'click', build);
    sc.add(function () { dead = true; clearInterval(tInt); });
    build();
    return function () { sc.done(); };
  }

  /* ---------- Breakout ---------- */
  function breakout(stage) {
    var sc = scope(), KEY = 'pa-best-breakout', W = 480, HT = 360, PY = 336, COLS = 8;
    var H = hud(stage, [['score', 'Score'], ['lives', 'Lives'], ['best', 'Best']]);
    var board = el('div', 'board bo'), cv = el('canvas'); board.appendChild(cv); stage.appendChild(board);
    var ov = overlay(board), ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = HT * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COLORS = ['#ff6b6b', '#ffd23f', '#4be3b0', '#5bb8ff', '#c18bff', '#ff9f5b', '#7be0ff', '#ff7bd0'];
    var paddle = { x: W / 2, w: 84, h: 10 }, ball = { x: 0, y: 0, vx: 0, vy: 0, r: 6 };
    var bricks, score, lives, level, state, msg, raf = 0, last = 0, keys = {}, best = store(KEY, 0), speed;
    H.best.textContent = best;

    function buildLevel() {
      var rows = 4 + Math.min(level, 4), bw = (W - 40 - (COLS - 1) * 4) / COLS, r, c;
      bricks = [];
      for (r = 0; r < rows; r++) for (c = 0; c < COLS; c++) bricks.push({ x: 20 + c * (bw + 4), y: 46 + r * 20, w: bw, h: 16, row: r, alive: true });
      speed = 250 + (level - 1) * 28;
      paddle.x = W / 2; held();
      msg = 'Level ' + level + ' · click, tap or press Space to launch';
    }
    function held() { state = 'ready'; ball.x = paddle.x; ball.y = PY - paddle.h / 2 - ball.r; ball.vx = 0; ball.vy = 0; }
    function newGame() { score = 0; lives = 3; level = 1; H.score.textContent = 0; H.lives.textContent = lives; ov.hide(); buildLevel(); }
    function launch() {
      if (state !== 'ready') return;
      var ang = (-90 + (Math.random() * 50 - 25)) * Math.PI / 180;
      ball.vx = speed * Math.cos(ang); ball.vy = speed * Math.sin(ang); state = 'playing'; msg = '';
    }
    function lose() {
      lives--; H.lives.textContent = Math.max(lives, 0);
      if (lives <= 0) {
        state = 'over'; var nbst = score > best;
        if (nbst) { best = score; save(KEY, best); H.best.textContent = best; }
        ov.show('Game over', 'You scored ' + score + '.' + (nbst ? ' New best!' : ''), 'Play again', newGame);
      } else { held(); msg = lives + (lives === 1 ? ' life' : ' lives') + ' left · click, tap or press Space'; }
    }
    function update(dt) {
      if (state === 'over') return;
      var mv = 0; if (keys.ArrowLeft || keys.a || keys.A) mv -= 1; if (keys.ArrowRight || keys.d || keys.D) mv += 1;
      if (mv) paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x + mv * 430 * dt));
      if (state === 'ready') { ball.x = paddle.x; ball.y = PY - paddle.h / 2 - ball.r; return; }
      var sp = Math.hypot(ball.vx, ball.vy), steps = Math.max(1, Math.ceil(sp * dt / 4)), s;
      for (s = 0; s < steps; s++) {
        ball.x += ball.vx * dt / steps; ball.y += ball.vy * dt / steps;
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
        if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
        if (ball.y - ball.r > HT) { lose(); return; }
        if (ball.vy > 0 && ball.y + ball.r >= PY - paddle.h / 2 && ball.y + ball.r <= PY + paddle.h / 2 + 8 &&
            ball.x > paddle.x - paddle.w / 2 - ball.r && ball.x < paddle.x + paddle.w / 2 + ball.r) {
          var hit = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2))), ang = hit * 60 * Math.PI / 180;
          var v = Math.min(540, Math.hypot(ball.vx, ball.vy) * 1.012);
          ball.vx = v * Math.sin(ang); ball.vy = -v * Math.cos(ang); ball.y = PY - paddle.h / 2 - ball.r;
        }
        for (var k = 0; k < bricks.length; k++) {
          var b = bricks[k];
          if (!b.alive) continue;
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            var ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
            var oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
            if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
            b.alive = false; score += 10 + (4 - Math.min(b.row, 4)) * 2; H.score.textContent = score;
            if (!bricks.some(function (x) { return x.alive; })) { level++; score += 50; H.score.textContent = score; buildLevel(); return; }
            break;
          }
        }
      }
    }
    function draw() {
      var g = ctx.createLinearGradient(0, 0, 0, HT); g.addColorStop(0, '#1d1a3f'); g.addColorStop(1, '#151330');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, HT);
      bricks.forEach(function (b) { if (!b.alive) return; ctx.fillStyle = COLORS[b.row % COLORS.length]; rr(ctx, b.x, b.y, b.w, b.h, 4); ctx.fill(); });
      ctx.fillStyle = '#ffd23f'; rr(ctx, paddle.x - paddle.w / 2, PY - paddle.h / 2, paddle.w, paddle.h, 5); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      if (msg) { ctx.fillStyle = '#a8a2d8'; ctx.font = '500 14px "DM Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, 270); }
    }
    function loop(ts) {
      raf = requestAnimationFrame(loop);
      var dt = Math.min((ts - last) / 1000 || 0.016, 0.033); last = ts;
      update(dt); draw();
    }
    function toX(e) { var r = board.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
    function follow(e) { if (state === 'over') return; paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, toX(e))); }

    sc.on(board, 'pointermove', follow);
    sc.on(board, 'pointerdown', follow);
    sc.on(board, 'click', launch);
    sc.on(window, 'keydown', function (e) {
      if (e.key.indexOf('Arrow') === 0 || e.key === ' ') e.preventDefault();
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') { if (state === 'ready') launch(); else if (state === 'over') newGame(); }
    });
    sc.on(window, 'keyup', function (e) { keys[e.key] = false; });
    sc.add(function () { cancelAnimationFrame(raf); });
    newGame(); raf = requestAnimationFrame(loop);
    return function () { sc.done(); };
  }

  /* ---------- shell ---------- */
  var ICONS = {
    snake: '<svg width="48" height="48" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 48H30A10 10 0 0 0 40 38V30A10 10 0 0 1 50 20H54" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="16" r="5" fill="#ffd23f"/></svg>',
    g2048: '<svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="8" y="8" width="23" height="23" rx="6" opacity=".35"/><rect x="33" y="8" width="23" height="23" rx="6" opacity=".6"/><rect x="8" y="33" width="23" height="23" rx="6" opacity=".8"/><rect x="33" y="33" width="23" height="23" rx="6"/></g></svg>',
    memory: '<svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="14" width="27" height="38" rx="6" transform="rotate(-10 22 33)" fill="none" stroke="currentColor" stroke-width="4"/><rect x="26" y="12" width="27" height="38" rx="6" transform="rotate(8 40 31)" fill="currentColor"/></svg>',
    breakout: '<svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="6" y="8" width="16" height="8" rx="2"/><rect x="24" y="8" width="16" height="8" rx="2" opacity=".6"/><rect x="42" y="8" width="16" height="8" rx="2"/><rect x="6" y="20" width="16" height="8" rx="2" opacity=".6"/><rect x="42" y="20" width="16" height="8" rx="2" opacity=".6"/><circle cx="34" cy="42" r="4" fill="#fff"/><rect x="20" y="54" width="24" height="5" rx="2.5"/></g></svg>'
  };
  var GAMES = {
    snake:    { title: 'Snake',        color: 'var(--mint)',  blurb: 'Eat, grow, and do not bite your own tail.', how: 'Steer with the arrow keys or WASD. On a phone, swipe on the board. Space pauses. Each dot you eat makes the snake a little faster.', make: snake, key: 'pa-best-snake', unit: '' },
    g2048:    { title: '2048',         color: 'var(--sun)',   blurb: 'Slide and merge tiles to reach 2048.',      how: 'Use the arrow keys or WASD, or swipe on the board. Tiles with the same number merge into one. Reach 2048, then keep going for a bigger score.', make: g2048, key: 'pa-best-2048', unit: '' },
    memory:   { title: 'Memory Match', color: 'var(--coral)', blurb: 'Flip cards and find all eight pairs.',      how: 'Tap two cards to flip them. Matching pairs stay open. Finish in as few moves as you can; your best move count is saved.', make: memory, key: 'pa-best-memory', unit: ' moves' },
    breakout: { title: 'Breakout',     color: 'var(--sky)',   blurb: 'Bounce the ball and clear every brick.',    how: 'Move the paddle with your mouse or finger, or use the left and right arrow keys. Click, tap or press Space to launch. You have three lives, and every cleared level speeds things up.', make: breakout, key: 'pa-best-breakout', unit: '' }
  };

  var home = document.getElementById('home'), view = document.getElementById('view'), grid = document.getElementById('grid');
  var stage = document.getElementById('stage'), titleEl = document.getElementById('gameTitle'), howEl = document.getElementById('how');
  var cardBests = {};

  Object.keys(GAMES).forEach(function (id) {
    var g = GAMES[id], a = el('a', 'card'); a.href = '#' + id; a.style.setProperty('--c', g.color);
    var ico = el('div', 'ico'); ico.innerHTML = ICONS[id];
    a.appendChild(ico); a.appendChild(el('h2', null, g.title)); a.appendChild(el('p', null, g.blurb));
    var b = el('div', 'best'); a.appendChild(b); cardBests[id] = b; grid.appendChild(a);
  });
  function refreshBests() {
    Object.keys(GAMES).forEach(function (id) {
      var v = store(GAMES[id].key, 0);
      cardBests[id].textContent = v ? 'Best: ' + v + GAMES[id].unit : 'Play to set a best';
    });
  }

  var current = null;
  function route() {
    var id = location.hash.replace('#', '');
    if (current) { current(); current = null; }
    stage.innerHTML = '';
    if (GAMES[id]) {
      var g = GAMES[id];
      home.hidden = true; view.hidden = false;
      view.style.setProperty('--c', g.color);
      titleEl.textContent = g.title; howEl.textContent = g.how;
      current = g.make(stage);
      window.scrollTo(0, 0);
    } else {
      view.hidden = true; home.hidden = false; refreshBests();
    }
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current) location.hash = 'home'; });
  route();
})();
</script>
